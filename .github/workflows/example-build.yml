name: Build C3 examples

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  build-c3-examples:
    name: Build ${{ matrix.example }} / ${{ matrix.board }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        example:
          - blink
          - digital_read
          - watchdog
        board:
          - arduino-uno
          - esp32c3

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup C3
        uses: jotrorox/setup-c3@v1

      # Each example defines one target per board, named "<example>-<board>"
      # with underscores replaced by dashes. `c3c build` without a target only
      # builds the first one, so the target is always passed explicitly.
      - name: Build example
        working-directory: examples/${{ matrix.example }}
        run: |
          target="$(echo "${{ matrix.example }}" | tr '_' '-')-${{ matrix.board }}"
          c3c build "$target"
          ls -la build/
