name: Build C3 examples

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  build-c3-examples:
    name: Build ${{ matrix.example }} / ${{ matrix.board }} (c3c ${{ matrix.compiler }})
    runs-on: ubuntu-latest
    # The library needs c3c 0.8.6, which is still a pre-release, so the
    # nightly leg is the one that must pass. The stable leg shows when the
    # current release can build the library; it is informational until a
    # stable 0.8.6 exists and the minimum version in the README is met by it.
    continue-on-error: ${{ matrix.compiler == 'stable' }}

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - nightly
          - stable
        example:
          - blink
          - digital_read
          - watchdog
          - uart_echo
          - analog_read
          - pwm_fade
          - button_irq
          - i2c_scan
          - spi_loopback
          - professional
        board:
          - arduino-uno
          - esp32c3

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup C3
        id: c3
        uses: jotrorox/setup-c3@v1
        with:
          version: ${{ matrix.compiler }}

      - name: Show compiler version
        run: |
          echo "Release tag: ${{ steps.c3.outputs.release-tag }}"
          c3c --version

      # Each example defines targets per board: "<example>-<board>" on the
      # release template and "<example>-<board>-debug" on the debug template,
      # with underscores replaced by dashes. `c3c build` without a target only
      # builds the first one, so the target is always passed explicitly.
      - name: Build example
        working-directory: examples/${{ matrix.example }}
        run: |
          target="$(echo "${{ matrix.example }}" | tr '_' '-')-${{ matrix.board }}"
          c3c build "$target"
          c3c build "$target-debug"
          ls -la build/

      # Runs the "flash-<board>" target as a dry run: builds the firmware,
      # compiles scripts/flash.c3 through `exec` and prints the flash commands
      # from the manifest's vendor block.
      - name: Flash target (dry run)
        working-directory: examples/${{ matrix.example }}
        run: FLASH_DRY_RUN=1 c3c build "flash-${{ matrix.board }}" --trust=full

      - name: Size
        run: |
          case "${{ matrix.board }}" in
            arduino-uno) board=arduino_uno ;;
            esp32c3) board=esp32c3_supermini ;;
          esac
          mkdir -p build
          c3c compile -q scripts/size.c3 -o build/size
          build/size --markdown "$board" examples/${{ matrix.example }}/build/*.elf >> "$GITHUB_STEP_SUMMARY"

  # Host-side unit tests for the parts of the library that do not touch
  # hardware: runtime arithmetic, duration and deadline maths (against a fake
  # clock), UART number formatting (against a fake port) and the GPIO pin
  # tables. One test target per MCU, because each compiles that MCU's backend.
  host-tests:
    name: Host tests / ${{ matrix.mcu }} (c3c ${{ matrix.compiler }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.compiler == 'stable' }}

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - nightly
          - stable
        mcu:
          - atmega328p
          - esp32c3

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup C3
        uses: jotrorox/setup-c3@v1
        with:
          version: ${{ matrix.compiler }}

      - name: Run tests
        working-directory: test
        run: c3c test ${{ matrix.mcu }}
